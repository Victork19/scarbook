services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: scarbook-api:latest
    env_file:
      - .env
    environment:
      DATABASE_PATH: /var/lib/scarbook/scarbook.db
      RAW_DIR: /var/lib/scarbook/raw
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - scarbook-data:/var/lib/scarbook
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  scarbook-data:
    name: scarbook-data
  caddy-data:
    name: scarbook-caddy-data
  caddy-config:
    name: scarbook-caddy-config
